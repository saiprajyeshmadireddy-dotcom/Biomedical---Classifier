name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q project/processors
      - name: Validate processor JSON
        run: python project/processors/check_processors.py
      - name: Run processor comparison and verify generated CSV
        run: |
          python project/processors/compare_processors.py
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("results/processor_comparison.csv")
          if not path.is_file():
              raise SystemExit(f"Expected comparison output was not created: {path}")
          with path.open(newline="", encoding="utf-8") as file:
              rows = list(csv.DictReader(file))
          if len(rows) != 2:
              raise SystemExit(f"Expected 2 processor rows, found {len(rows)}")
          expected = {"Processor A", "Processor B"}
          if {row.get("processor") for row in rows} != expected:
              raise SystemExit("Comparison CSV must contain Processor A and Processor B")
          required = {
              "configured_qubits", "logical_circuit_qubits", "depth",
              "total_operations", "cx_count", "swap_count", "rz_count",
              "sx_count", "definition_status", "connectivity_assumption",
          }
          if not required.issubset(rows[0]):
              raise SystemExit(f"Missing CSV columns: {sorted(required - set(rows[0]))}")
          for row in rows:
              for key in ("configured_qubits", "logical_circuit_qubits", "depth",
                          "total_operations", "cx_count", "swap_count", "rz_count", "sx_count"):
                  if int(row[key]) < 0:
                      raise SystemExit(f"Negative {key} for {row['processor']}")
          print("PASS: generated processor comparison CSV validated.")
          PY
      - name: Run ECG classifier when dataset files are available
        run: |
          if [ -f data/mitbih_train.csv ] && [ -f data/mitbih_test.csv ]; then
            python project/processors/main_real_ecg.py
          else
            echo "::warning::ECG classifier was not run: data/mitbih_train.csv and/or data/mitbih_test.csv are missing. See data/README.md."
          fi
      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomedical-classifier-results
          path: |
            results/processor_comparison.csv
            results/ecg_metrics.json
            results/ecg_metrics.csv
            results/ecg_confusion_matrix.png
          if-no-files-found: warn
